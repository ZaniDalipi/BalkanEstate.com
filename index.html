      }
      .hero-stagger > .hero-fade-up:nth-child(1) { animation-delay: 0s; }

      .hero-stagger > .hero-fade-up:nth-child(3) { animation-delay: 0.16s; }
      .hero-stagger > .hero-fade-up:nth-child(4) { animation-delay: 0.24s; }
      .hero-stagger > .hero-fade-up:nth-child(5) { animation-delay: 0.32s; }
