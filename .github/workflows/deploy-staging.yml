name: Deploy Staging

on:
  push:
    branches: [develop, staging]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Build & Test
  # =============================================================================
  build:
    name: Build Staging
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Type check frontend
        run: npx tsc --noEmit

      - name: Build frontend (staging)
        run: npm run build:staging
        env:
          VITE_API_URL: ${{ secrets.STAGING_VITE_API_URL || secrets.VITE_API_URL }}
          VITE_ENVIRONMENT: staging
          VITE_SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-staging-dist
          path: dist-staging/
          retention-days: 7

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-staging-dist
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json
          retention-days: 7

  # =============================================================================
  # Deploy Frontend to Cloudflare Pages (Staging/Preview)
  # =============================================================================
  deploy-frontend:
    name: Deploy Frontend (Staging)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging
      url: https://staging.balkanestateai.com
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-staging-dist
          path: dist-staging/

      - name: Deploy to Cloudflare Pages (Preview Branch)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-staging --project-name=balkanestateai --branch=staging

      - name: Deployment Summary
        run: |
          echo "## Staging Frontend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://staging.balkanestateai.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Preview**: https://staging.balkanestateai.pages.dev" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Deploy Backend (Docker-based staging)
  # =============================================================================
  deploy-backend:
    name: Deploy Backend (Staging)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: staging-backend
      url: https://staging-api.balkanestateai.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download backend artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-staging-dist
          path: backend-staging/

      # Option 1: Deploy to Railway
      - name: Deploy to Railway (if configured)
        if: env.RAILWAY_TOKEN != ''
        env:
          RAILWAY_TOKEN: ${{ secrets.STAGING_RAILWAY_TOKEN }}
        run: |
          npm install -g @railway/cli
          cd backend
          railway up --environment staging

      # Option 2: Build and push Docker image
      - name: Set up Docker Buildx
        if: env.RAILWAY_TOKEN == ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Container Registry
        if: env.RAILWAY_TOKEN == '' && env.REGISTRY_URL != ''
        uses: docker/login-action@v3
        env:
          REGISTRY_URL: ${{ secrets.STAGING_REGISTRY_URL }}
        with:
          registry: ${{ secrets.STAGING_REGISTRY_URL }}
          username: ${{ secrets.STAGING_REGISTRY_USERNAME }}
          password: ${{ secrets.STAGING_REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        if: env.RAILWAY_TOKEN == '' && env.REGISTRY_URL != ''
        uses: docker/build-push-action@v5
        env:
          REGISTRY_URL: ${{ secrets.STAGING_REGISTRY_URL }}
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.STAGING_REGISTRY_URL }}/balkanestate-backend:staging
            ${{ secrets.STAGING_REGISTRY_URL }}/balkanestate-backend:staging-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment Summary
        run: |
          echo "## Staging Backend Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **API URL**: https://staging-api.balkanestateai.com" >> $GITHUB_STEP_SUMMARY
          echo "- **Health**: https://staging-api.balkanestateai.com/health" >> $GITHUB_STEP_SUMMARY

  # =============================================================================
  # Post-deploy Smoke Test
  # =============================================================================
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always() && needs.deploy-frontend.result == 'success'
    steps:
      - name: Wait for deployment propagation
        run: sleep 30

      - name: Check frontend health
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://staging.balkanestateai.com || echo "000")
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Frontend is healthy (HTTP $STATUS)"
          else
            echo "Frontend health check failed (HTTP $STATUS)"
            echo "Note: DNS may not be configured yet for staging subdomain"
          fi

      - name: Check backend health
        if: env.STAGING_API_URL != ''
        env:
          STAGING_API_URL: ${{ secrets.STAGING_VITE_API_URL }}
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_API_URL/../health" || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "Backend is healthy"
          else
            echo "Backend health check returned HTTP $STATUS"
            echo "Note: Backend may need to be deployed separately"
          fi

  # =============================================================================
  # Notify
  # =============================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    if: always()
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy-frontend.result }}
          text: |
            Staging deployment ${{ needs.deploy-frontend.result }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            URL: https://staging.balkanestateai.com
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
