name: Deploy

# Every push to main goes:  CI  →  staging  →  (your approval)  →  production
#
# - CI (lint, type check, builds) must pass before anything is deployed.
# - Staging is the Cloudflare Pages "staging" branch:
#   https://staging.balkanestateai.pages.dev (not indexed by search engines).
# - Production waits for a required reviewer on the "production" environment
#   (repo Settings → Environments → production → Required reviewers).
#   Without that rule it deploys straight after staging succeeds.
#
# "Run workflow" (manual) redeploys the selected branch through the same steps.

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than cancelling a deploy
# that's halfway through.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  staging:
    name: Staging
    needs: ci
    uses: ./.github/workflows/deploy-pages.yml
    with:
      environment: staging
      pages-branch: staging
      url: https://staging.balkanestateai.pages.dev
    secrets: inherit

  production:
    name: Production
    needs: staging
    uses: ./.github/workflows/deploy-pages.yml
    with:
      environment: production
      pages-branch: main
      url: https://balkanestateai.com
    secrets: inherit

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [staging, production]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ contains(needs.*.result, 'failure') && 'failure' || 'success' }}
          text: |
            Deploy: staging ${{ needs.staging.result }}, production ${{ needs.production.result }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
