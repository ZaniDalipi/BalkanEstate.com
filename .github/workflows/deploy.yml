name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Build
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_MEDIA_CDN_URL: ${{ secrets.VITE_MEDIA_CDN_URL }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_FB_PIXEL_ID: ${{ secrets.VITE_FB_PIXEL_ID }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}
          # Basemap provider. Keyless by default; set the VITE_CARTO_API_KEY
          # secret to use CARTO's styles instead (see config/mapStyles.ts).
          VITE_MAP_KEYLESS_PROVIDER: ${{ secrets.VITE_MAP_KEYLESS_PROVIDER || 'osm' }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
          VITE_STADIA_API_KEY: ${{ secrets.VITE_STADIA_API_KEY }}
          # AdSense fill for unbooked ad slots (src/features/promo/components/NetworkFill.tsx).
          # Client defaults to this site's publisher id in code; slots have no
          # default, so an ad unit's id must be set here for it to fill at all.
          VITE_ADSENSE_CLIENT: ${{ secrets.VITE_ADSENSE_CLIENT }}
          VITE_ADSENSE_SLOT: ${{ secrets.VITE_ADSENSE_SLOT }}
          VITE_ADSENSE_SLOT_LEADERBOARD: ${{ secrets.VITE_ADSENSE_SLOT_LEADERBOARD }}
          VITE_ADSENSE_SLOT_SIDEBAR: ${{ secrets.VITE_ADSENSE_SLOT_SIDEBAR }}
          VITE_ADSENSE_SLOT_STICKY: ${{ secrets.VITE_ADSENSE_SLOT_STICKY }}

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json

  # =============================================================================
  # Deploy Frontend to Cloudflare Pages (Preview/Staging)
  # =============================================================================
  deploy-staging:
    name: Deploy to Cloudflare Pages (Preview)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.balkanestateai.com
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Check Cloudflare credentials
        # Cloudflare answers "Authentication error [code: 10000]" for several
        # different mistakes, and the deploy log cannot say which because both
        # secrets are masked. This step checks each one against the Cloudflare
        # API and prints what is wrong, without printing the secrets.
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: balkanestateai
        run: |
          fail() { echo "::error title=Cloudflare credentials::$1"; exit 1; }
          [ -n "$CF_TOKEN" ] || fail "Secret CLOUDFLARE_API_TOKEN is empty or missing."
          [ -n "$CF_ACCOUNT" ] || fail "Secret CLOUDFLARE_ACCOUNT_ID is empty or missing."
          [ "$CF_TOKEN" = "$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')" ] || fail "CLOUDFLARE_API_TOKEN contains spaces or a line break - paste it again without them."
          [ "$CF_ACCOUNT" = "$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')" ] || fail "CLOUDFLARE_ACCOUNT_ID contains spaces or a line break - paste it again without them."
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }

          verify=$(api /user/tokens/verify)
          [ "$(echo "$verify" | jq -r '.success')" = "true" ] || fail "The API token is invalid, expired or revoked: $(echo "$verify" | jq -c '.errors')"
          echo "Token is valid and $(echo "$verify" | jq -r '.result.status')."

          accounts=$(api "/accounts?per_page=50" | jq -r '.result[]? | "\(.id) \(.name)"')
          echo "Accounts this token can see:"; echo "$accounts" | sed 's/^/  /'
          if [ -n "$accounts" ] && ! echo "$accounts" | grep -q "^$CF_ACCOUNT "; then
            fail "CLOUDFLARE_ACCOUNT_ID is not one of the accounts above. Set it to the ID of the account that owns the Pages project."
          fi

          project=$(api "/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT")
          if [ "$(echo "$project" | jq -r '.success')" != "true" ]; then
            code=$(echo "$project" | jq -r '.errors[0].code // empty')
            case "$code" in
              10000) fail "The token is not allowed to use Cloudflare Pages on this account. Edit the token and add: Account > Cloudflare Pages > Edit, scoped to this account." ;;
              8000007) fail "No Pages project named '$CF_PROJECT' on this account. Check the project name in the dashboard (Workers & Pages)." ;;
              *) fail "Cloudflare refused the Pages project lookup: $(echo "$project" | jq -c '.errors')" ;;
            esac
          fi
          echo "Pages project '$CF_PROJECT' found; the token can deploy to it."

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned, as Cloudflare's wrangler-action docs recommend, instead of
          # the action's old default (3.90.0).
          wranglerVersion: '3.114.0'
          command: pages deploy dist --project-name=balkanestateai --branch=preview

      - name: Deployment Summary
        run: |
          echo "Staging Deployment Complete"
          echo "=============================="
          echo "Frontend: https://preview.balkanestateai.pages.dev"
          echo "Note: Backend should be deployed separately to Railway/Render"

  # =============================================================================
  # Deploy Frontend to Cloudflare Pages (Production)
  # =============================================================================
  deploy-production:
    name: Deploy to Cloudflare Pages (Production)
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    # Deploy to production automatically on every push to main, and also when the
    # workflow is manually dispatched with environment=production.
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://balkanestateai.com
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Check Cloudflare credentials
        # Cloudflare answers "Authentication error [code: 10000]" for several
        # different mistakes, and the deploy log cannot say which because both
        # secrets are masked. This step checks each one against the Cloudflare
        # API and prints what is wrong, without printing the secrets.
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PROJECT: balkanestateai
        run: |
          fail() { echo "::error title=Cloudflare credentials::$1"; exit 1; }
          [ -n "$CF_TOKEN" ] || fail "Secret CLOUDFLARE_API_TOKEN is empty or missing."
          [ -n "$CF_ACCOUNT" ] || fail "Secret CLOUDFLARE_ACCOUNT_ID is empty or missing."
          [ "$CF_TOKEN" = "$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')" ] || fail "CLOUDFLARE_API_TOKEN contains spaces or a line break - paste it again without them."
          [ "$CF_ACCOUNT" = "$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')" ] || fail "CLOUDFLARE_ACCOUNT_ID contains spaces or a line break - paste it again without them."
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" "https://api.cloudflare.com/client/v4$1"; }

          verify=$(api /user/tokens/verify)
          [ "$(echo "$verify" | jq -r '.success')" = "true" ] || fail "The API token is invalid, expired or revoked: $(echo "$verify" | jq -c '.errors')"
          echo "Token is valid and $(echo "$verify" | jq -r '.result.status')."

          accounts=$(api "/accounts?per_page=50" | jq -r '.result[]? | "\(.id) \(.name)"')
          echo "Accounts this token can see:"; echo "$accounts" | sed 's/^/  /'
          if [ -n "$accounts" ] && ! echo "$accounts" | grep -q "^$CF_ACCOUNT "; then
            fail "CLOUDFLARE_ACCOUNT_ID is not one of the accounts above. Set it to the ID of the account that owns the Pages project."
          fi

          project=$(api "/accounts/$CF_ACCOUNT/pages/projects/$CF_PROJECT")
          if [ "$(echo "$project" | jq -r '.success')" != "true" ]; then
            code=$(echo "$project" | jq -r '.errors[0].code // empty')
            case "$code" in
              10000) fail "The token is not allowed to use Cloudflare Pages on this account. Edit the token and add: Account > Cloudflare Pages > Edit, scoped to this account." ;;
              8000007) fail "No Pages project named '$CF_PROJECT' on this account. Check the project name in the dashboard (Workers & Pages)." ;;
              *) fail "Cloudflare refused the Pages project lookup: $(echo "$project" | jq -c '.errors')" ;;
            esac
          fi
          echo "Pages project '$CF_PROJECT' found; the token can deploy to it."

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pinned, as Cloudflare's wrangler-action docs recommend, instead of
          # the action's old default (3.90.0).
          wranglerVersion: '3.114.0'
          command: pages deploy dist --project-name=balkanestateai --branch=main

      - name: Deployment Summary
        run: |
          echo "Production Deployment Complete"
          echo "================================="
          echo "Frontend: https://balkanestateai.com"
          echo "Note: Backend should be deployed separately to Railway/Render"

  # =============================================================================
  # Notify on Deployment
  # =============================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to ${{ github.event.inputs.environment || 'staging' }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
