name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Build
  # =============================================================================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          # Image CDN host (Bunny pull zone). Must match the backend's
          # BUNNY_PULL_ZONE_HOST — a mismatch renders every image as a 404.
          VITE_CDN_HOST: ${{ secrets.VITE_CDN_HOST }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_FB_PIXEL_ID: ${{ secrets.VITE_FB_PIXEL_ID }}
          VITE_CLARITY_PROJECT_ID: ${{ secrets.VITE_CLARITY_PROJECT_ID }}
          # Basemap provider. Keyless by default; set the VITE_CARTO_API_KEY
          # secret to use CARTO's styles instead (see config/mapStyles.ts).
          VITE_MAP_KEYLESS_PROVIDER: ${{ secrets.VITE_MAP_KEYLESS_PROVIDER || 'osm' }}
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}
          VITE_STADIA_API_KEY: ${{ secrets.VITE_STADIA_API_KEY }}

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: |
            backend/dist/
            backend/package.json
            backend/package-lock.json

  # =============================================================================
  # Deploy Frontend to Cloudflare Pages (Preview/Staging)
  # =============================================================================
  deploy-staging:
    name: Deploy to Cloudflare Pages (Preview)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'staging'
    environment:
      name: staging
      url: https://staging.balkanestateai.com
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=balkanestateai --branch=preview

      - name: Deployment Summary
        run: |
          echo "Staging Deployment Complete"
          echo "=============================="
          echo "Frontend: https://preview.balkanestateai.pages.dev"
          echo "Note: Backend should be deployed separately to Railway/Render"

  # =============================================================================
  # Deploy Frontend to Cloudflare Pages (Production)
  # =============================================================================
  deploy-production:
    name: Deploy to Cloudflare Pages (Production)
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    # Deploy to production automatically on every push to main, and also when the
    # workflow is manually dispatched with environment=production.
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://balkanestateai.com
    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Deploy to Cloudflare Pages (Production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=balkanestateai --branch=main

      - name: Deployment Summary
        run: |
          echo "Production Deployment Complete"
          echo "================================="
          echo "Frontend: https://balkanestateai.com"
          echo "Note: Backend should be deployed separately to Railway/Render"

  # =============================================================================
  # Notify on Deployment
  # =============================================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Deployment to ${{ github.event.inputs.environment || 'staging' }}
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
