name: CI

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop, staging]

env:
  NODE_VERSION: '20'

jobs:
  # =============================================================================
  # Lint and Type Check
  # =============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Type check frontend
        run: npm run type-check || npx tsc --noEmit

      - name: Type check backend
        working-directory: ./backend
        run: npm run build

  # =============================================================================
  # Build Frontend
  # =============================================================================
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.balkanestate.com/api' }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # =============================================================================
  # Build Backend
  # =============================================================================
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build backend
        working-directory: ./backend
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist/
          retention-days: 7

  # =============================================================================
  # Test Backend (when tests are added)
  # =============================================================================
  # test-backend:
  #   name: Test Backend
  #   runs-on: ubuntu-latest
  #   needs: build-backend
  #   services:
  #     mongodb:
  #       image: mongo:7
  #       ports:
  #         - 27017:27017
  #   steps:
  #     - name: Checkout code
  #       uses: actions/checkout@v4
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ env.NODE_VERSION }}
  #         cache: 'npm'
  #         cache-dependency-path: backend/package-lock.json
  #
  #     - name: Install dependencies
  #       working-directory: ./backend
  #       run: npm ci
  #
  #     - name: Run tests
  #       working-directory: ./backend
  #       run: npm test
  #       env:
  #         MONGODB_URI: mongodb://localhost:27017/test
  #         JWT_SECRET: test-secret
  #         JWT_REFRESH_SECRET: test-refresh-secret

  # =============================================================================
  # Security Audit
  # =============================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high || true

      - name: Audit backend dependencies
        working-directory: ./backend
        run: npm audit --audit-level=high || true

  # =============================================================================
  # Bundle Size Check
  # =============================================================================
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Check bundle size
        run: |
          echo "📦 Bundle Size Report"
          echo "===================="
          find dist -name "*.js" -type f -exec du -h {} + | sort -rh | head -20
          echo ""
          echo "Total JavaScript size:"
          find dist -name "*.js" -type f -exec cat {} + | wc -c | awk '{printf "%.2f MB\n", $1/1024/1024}'
          echo ""
          echo "Total CSS size:"
          find dist -name "*.css" -type f -exec cat {} + | wc -c | awk '{printf "%.2f KB\n", $1/1024}'
