# =============================================================================
# Docker Compose — Production
#
# Services:
#   nginx    — reverse proxy + static file server (port 80/443)
#   backend  — Express API (internal only, port 5001)
#   mongodb  — database (internal only)
#
# Build & deploy:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# SSL certificates must be present at ./ssl/ before starting:
#   ./ssl/fullchain.pem
#   ./ssl/privkey.pem
# (e.g. from Let's Encrypt via certbot)
# =============================================================================

version: '3.8'

services:
  # ── MongoDB ─────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: balkanestate-mongodb-prod
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=balkanestate
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Express backend (API) ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balkanestate-backend-prod
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=5001
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal

  # ── Nginx (reverse proxy + static files) ─────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: balkanestate-nginx-prod
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Nginx configuration
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Built frontend static files (run `npm run build` before deploying)
      - ./dist:/usr/share/nginx/html:ro
      # SSL certificates (from Let's Encrypt or your CA)
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: nginx -t || exit 1
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - internal
      - external

volumes:
  mongodb_data:

networks:
  # backend ↔ mongodb communication (not exposed to host)
  internal:
    name: balkanestate-internal
  # nginx exposed to the internet
  external:
    name: balkanestate-external
