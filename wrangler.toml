# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/configuration/wrangler-configuration/

name = "balkanestateai"
compatibility_date = "2024-01-01"

# Pages-specific configuration
[pages]
build_command = "npm run build"
build_output_dir = "dist"

# Environment variables (set these in Cloudflare Dashboard for security)
# [vars]
# VITE_API_URL = "https://api.balkanestateai.com"

# Production environment
[env.production]
# Production-specific settings
# vars = { VITE_API_URL = "https://api.balkanestateai.com" }

# Staging/Preview environment
[env.preview]
# Preview-specific settings
# vars = { VITE_API_URL = "https://staging-api.balkanestateai.com" }
