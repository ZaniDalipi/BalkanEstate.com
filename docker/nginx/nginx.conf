# =============================================================================
# Nginx Configuration — BalkanEstateAI Production
#
# Architecture:
#   nginx (80/443) → static files from /usr/share/nginx/html (built frontend)
#                  → proxy /api/* to Express backend (port 5001)
#                  → proxy /socket.io/ to Express backend (WebSocket)
#                  → proxy dynamic SEO files (sitemap.xml, robots.txt) to backend
#                  → SPA fallback: try_files $uri /index.html for all other routes
#
# The SPA fallback (try_files) is what makes copied property URLs work:
# /en/property/some-slug has no static file, so nginx serves index.html and
# the React app handles the route client-side.
# =============================================================================

upstream backend {
    server backend:5001;
    keepalive 32;
}

# Redirect HTTP → HTTPS in production (remove this block if SSL is terminated
# upstream by a load balancer / Cloudflare)
server {
    listen 80;
    server_name balkanestateai.com www.balkanestateai.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name balkanestateai.com www.balkanestateai.com;

    # ── SSL ───────────────────────────────────────────────────────────────────
    # Update these paths to match your certificate location (e.g. Let's Encrypt)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Root: built frontend ──────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml;
    gzip_min_length 1000;

    # ── Static assets — long-lived cache ─────────────────────────────────────
    # Vite fingerprints these files so stale cache is never a problem.
    location ~* \.(?:js|css|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|svg|webp|avif|map)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri @asset_not_found;
    }

    # Return an empty 404 (no body) for missing static assets.
    # nginx's default =404 serves its HTML error page (Content-Type: text/html),
    # which causes "Failed to load module script" MIME-type errors in browsers
    # when a stale page references old hashed filenames after a new deploy.
    location @asset_not_found {
        return 404;
    }

    # ── PWA manifest & service worker — short cache ───────────────────────────
    location ~* \.(?:webmanifest|manifest\.json)$ {
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
    location = /sw.js {
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── API — proxy to Express backend ───────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── WebSocket (Socket.IO) — proxy to Express ──────────────────────────────
    location /socket.io/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 86400s;   # keep long-lived WS connections open
    }

    # ── Dynamic SEO files — proxy to Express (generated at runtime) ───────────
    location ~* ^/(sitemap(?:-index)?\.xml|robots\.txt|llms\.txt)$ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Health check ──────────────────────────────────────────────────────────
    location = /health {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ── index.html — never cache so fresh asset fingerprints always load ─────
    # Without this, browsers serve stale index.html after a deploy and try to
    # load old fingerprinted JS/CSS filenames that no longer exist on the server.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # ── SPA fallback ─────────────────────────────────────────────────────────
    # This is the critical rule that fixes 404s on direct URL access / copy-paste.
    # When nginx cannot find a static file for the requested path (e.g.
    # /en/property/some-slug has no matching file in dist/) it falls back to
    # index.html and the React app handles routing client-side.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
