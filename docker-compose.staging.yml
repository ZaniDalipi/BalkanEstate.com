# =============================================================================
# Docker Compose for Staging Environment
# =============================================================================
# Usage:
#   docker compose -f docker-compose.staging.yml up -d
#   docker compose -f docker-compose.staging.yml down
#
# Prerequisites:
#   - Copy backend/.env.staging.example to backend/.env.staging and fill in values
#   - Ensure staging MongoDB URI is configured (cloud-hosted recommended)

services:
  # Backend API (Staging)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: balkanestate-staging-backend
    restart: unless-stopped
    ports:
      - '5001:5001'
    env_file:
      - ./backend/.env.staging
    environment:
      - NODE_ENV=staging
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5001/health || exit 1
      interval: 30s
      timeout: 3s
      start-period: 10s
      retries: 3

  # Frontend (Staging - serves built assets via nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.staging
    container_name: balkanestate-staging-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    name: balkanestate-staging-network
