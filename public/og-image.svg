<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0252CD;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003A96;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFA500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8C00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-gradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="white" opacity="0.05"/>
  <circle cx="1100" cy="530" r="250" fill="white" opacity="0.05"/>

  <!-- Logo Icon -->
  <g transform="translate(100, 200)">
    <rect x="0" y="80" width="60" height="120" fill="white" opacity="0.9"/>
    <rect x="80" y="0" width="80" height="200" fill="white"/>
    <polygon points="0,80 80,0 80,80" fill="white" opacity="0.7"/>
  </g>

  <!-- Main Text -->
  <text x="280" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">
    Balkan Estate
  </text>

  <!-- Tagline -->
  <text x="280" y="350" font-family="Arial, sans-serif" font-size="32" fill="white" opacity="0.9">
    Find Your Dream Property in the Balkans
  </text>

  <!-- Accent line -->
  <rect x="280" y="380" width="200" height="6" rx="3" fill="url(#accent-gradient)"/>

  <!-- Features -->
  <g transform="translate(280, 440)" font-family="Arial, sans-serif" font-size="24" fill="white" opacity="0.85">
    <text x="0" y="0">Houses</text>
    <circle cx="120" cy="-8" r="4" fill="#FFA500"/>
    <text x="140" y="0">Apartments</text>
    <circle cx="310" cy="-8" r="4" fill="#FFA500"/>
    <text x="330" y="0">Villas</text>
    <circle cx="430" cy="-8" r="4" fill="#FFA500"/>
    <text x="450" y="0">Land</text>
  </g>

  <!-- Countries -->
  <g transform="translate(280, 500)" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.7">
    <text x="0" y="0">Serbia • Montenegro • Croatia • Bosnia • North Macedonia • Albania</text>
  </g>

  <!-- Website URL -->
  <text x="280" y="570" font-family="Arial, sans-serif" font-size="24" fill="#FFA500" font-weight="bold">
    balkanestateai.com
  </text>
</svg>
