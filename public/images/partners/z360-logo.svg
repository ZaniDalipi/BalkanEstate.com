<svg width="180" height="70" viewBox="0 0 180 70" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="180" height="70" rx="8" fill="#1E293B"/>

  <!-- Z with degree symbol -->
  <text x="18" y="42" font-family="Arial Black, sans-serif" font-size="36" font-weight="900" fill="#F0D9A0">Z</text>
  <text x="44" y="24" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#F0D9A0">o</text>

  <!-- 360 text -->
  <text x="58" y="42" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#F0D9A0">360</text>

  <!-- Circular arrow around 360 -->
  <path d="M56 20 Q48 12, 58 10" stroke="#F0D9A0" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="58,10 55,14 60,13" fill="#F0D9A0"/>

  <path d="M128 44 Q136 52, 126 54" stroke="#F0D9A0" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="126,54 129,50 124,51" fill="#F0D9A0"/>

  <!-- VIRTUAL TOURS text -->
  <text x="90" y="60" font-family="Arial, sans-serif" font-size="10" font-weight="bold" letter-spacing="1.5" fill="#F0D9A0" text-anchor="middle">360 VIRTUAL TOURS</text>
</svg>
