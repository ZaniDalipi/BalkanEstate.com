<svg width="200" height="80" viewBox="0 0 200 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="200" height="80" rx="8" fill="#1a2332"/>

  <!-- Z Letter -->
  <text x="20" y="48" font-family="Georgia, serif" font-size="42" font-weight="bold" font-style="italic" fill="#f5e6c8">Z</text>

  <!-- Camera Icon Background -->
  <rect x="52" y="12" width="24" height="28" rx="4" fill="#f5e6c8"/>

  <!-- Camera Lens -->
  <circle cx="64" cy="24" r="6" fill="#1a2332"/>
  <circle cx="64" cy="24" r="3" fill="#f5e6c8"/>

  <!-- 360 with arrows -->
  <text x="80" y="38" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f5e6c8">360</text>

  <!-- Circular arrow (simplified) -->
  <path d="M78 30 C75 25, 80 20, 88 22" stroke="#f5e6c8" stroke-width="1.5" fill="none"/>
  <path d="M108 35 C112 40, 107 45, 98 43" stroke="#f5e6c8" stroke-width="1.5" fill="none"/>

  <!-- Arrow heads -->
  <polygon points="88,22 85,19 86,24" fill="#f5e6c8"/>
  <polygon points="98,43 101,46 100,41" fill="#f5e6c8"/>

  <!-- 360 VIRTUAL TOURS text -->
  <text x="20" y="68" font-family="Arial, sans-serif" font-size="11" font-weight="bold" letter-spacing="2" fill="#f5e6c8">360 VIRTUAL TOURS</text>
</svg>